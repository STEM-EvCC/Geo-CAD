<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Railbench Layout Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE   work tool: calm, exact, nothing between the modeller and the layout
   IDEA    a layout bench seen from above: tan homasote board, Atlas Code 100 track with black ties and nickel-silver rails
   PICTURE the live layout canvas, edge to edge between a parts rack and an inspector
   COLOUR  board tan on a graphite surround, white chrome, ink, one signal red for selection and open rail ends
   TYPE    Barlow 600 for headings and controls, Barlow 400 for text
   LAYOUT  laptop: toolbar / parts | canvas | inspector / status; under 900px the inspector slides over; under 700px both panels are drawers */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#16181a);--ink:light-dark(#16181a,#ebe9e4);--mute:light-dark(#5c6166,#a2a7ac);
--line:light-dark(#e3e1dc,#2d3034);--panel:light-dark(#f5f4f1,#1d2023);--hover:light-dark(#ecebe7,#272a2e);
--surround:light-dark(#3b3e3c,#0d0f10);--board:light-dark(#dcd3c1,#4b463d);--grid:light-dark(rgba(70,55,30,.16),rgba(255,236,200,.09));
--grid2:light-dark(rgba(70,55,30,.32),rgba(255,236,200,.2));--tie:light-dark(#2b2723,#17140f);--rail:light-dark(#9ea6af,#cdd2d8);
--accent:light-dark(#d4361b,#ff6b4f);--ok:light-dark(#1d7a4b,#4cc58b);--warn:light-dark(#9a5a00,#f0b25a);--fig:light-dark(#6b6457,#b9b0a0)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px max(10px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em;margin-right:6px;white-space:nowrap}
.brand small{font-weight:500;color:var(--mute);font-size:13px;margin-left:6px}
.sep{width:1px;height:26px;background:var(--line);margin:0 4px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.icon{padding:0 9px}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn svg{width:18px;height:18px;flex:none}
.file{margin-left:auto;font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32ch}
.file b{color:var(--ink);font-weight:600}
.main{display:grid;grid-template-columns:250px minmax(0,1fr) 310px;min-height:0}
aside{background:var(--panel);overflow:auto;min-height:0}
#parts{border-right:1px solid var(--line);padding:10px}
#side{border-left:1px solid var(--line);display:flex;flex-direction:column}
.search{width:100%;min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}
.grp{margin:14px 0 4px;font-weight:600;font-size:13px;color:var(--mute)}
.part{display:flex;align-items:center;gap:9px;width:100%;min-height:44px;padding:4px 8px;border:1px solid transparent;border-radius:8px;background:none;text-align:left;touch-action:none}
.part:hover{background:var(--hover);border-color:var(--line)}
.part svg{width:58px;height:30px;flex:none}
.part span{display:flex;flex-direction:column;line-height:1.15}
.part b{font-weight:600;font-size:14px}
.part i{font-style:normal;font-size:13px;color:var(--mute)}
.stage{position:relative;min-height:0;background:var(--surround);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:default}
.hint{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:none}
.chip{pointer-events:auto;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip button{border:0;background:none;font-weight:600;color:var(--accent);padding:0 4px;min-height:28px}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:42px;justify-content:center;padding:0}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:1}
.tabs button{flex:1;min-height:42px;border:0;border-bottom:2px solid transparent;background:none;font-weight:600;font-size:14px;color:var(--mute)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:12px 14px;display:none}
.pane.on{display:block}
h2{font-size:20px;line-height:1.1;margin:2px 0 4px;letter-spacing:-.01em}
h3{font-size:14px;margin:16px 0 6px;color:var(--mute);font-weight:600}
p{margin:6px 0}
.muted{color:var(--mute)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute);font-weight:600}
input.n,select.n{min-height:40px;width:100%;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-size:16px;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:150px;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;overflow:auto;resize:vertical}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:600}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ends button{width:100%;justify-content:space-between;margin:3px 0}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--ok)}
.meter.over i{background:var(--accent)}
.warnbox{border-left:3px solid var(--warn);padding:4px 10px;margin:8px 0;font-size:14px}
.status{display:flex;gap:14px;flex-wrap:wrap;padding:5px max(12px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;background:var(--bg)}
.status b{color:var(--ink);font-weight:600}
.status .open b{color:var(--accent)}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--bg);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100% - 40px)}
dialog::backdrop{background:rgba(10,12,14,.45)}
.dlg{padding:18px 20px;overflow:auto}
.dlg h2{font-size:22px;margin-bottom:8px}
.dlg .row{margin-top:12px}
.dlg ol{padding-left:20px;margin:8px 0}
.dlg li{margin:5px 0}
kbd{font:12px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--panel)}
.keys td:first-child{white-space:nowrap}
.colors{position:absolute;width:0;height:0;overflow:hidden}
.drawer-btn{display:none}
@media (max-width:900px){
.main{grid-template-columns:230px minmax(0,1fr)}
#side{position:fixed;right:0;top:0;bottom:0;width:min(340px,92vw);z-index:5;transform:translateX(105%);transition:transform .18s ease;box-shadow:-6px 0 18px rgba(0,0,0,.18)}
#side.open{transform:none}
.drawer-btn.side{display:inline-flex}
}
@media (max-width:700px){
.main{grid-template-columns:minmax(0,1fr)}
#parts{position:fixed;left:0;top:0;bottom:0;width:min(300px,88vw);z-index:5;transform:translateX(-105%);transition:transform .18s ease;box-shadow:6px 0 18px rgba(0,0,0,.18)}
#parts.open{transform:none}
.drawer-btn{display:inline-flex}
.btn .lbl{display:none}
.file{display:none}
.brand small{display:none}
}
@media (prefers-reduced-motion:reduce){#side,#parts{transition:none}}
</style>
</head>
<body>
<header class="bar" id="bar">
  <span class="brand">Railbench<small>.scarm layout editor</small></span>
  <button class="btn icon drawer-btn" id="bParts" aria-label="Parts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="lbl">Parts</span></button>
  <button class="btn" id="bOpen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v10H3z"/></svg><span class="lbl">Open</span></button>
  <button class="btn" id="bNew"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M12 10v7M8.5 13.5h7"/></svg><span class="lbl">New</span></button>
  <button class="btn primary" id="bSave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="lbl">Save</span></button>
  <span class="sep"></span>
  <button class="btn icon" id="bUndo" aria-label="Undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 7 4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12"/></svg></button>
  <button class="btn icon" id="bRedo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 7 5 5-5 5"/><path d="M20 12H10a6 6 0 0 0 0 12"/></svg></button>
  <button class="btn icon" id="bRot" aria-label="Rotate 15 degrees" title="Rotate 15° (R, Shift+R reverses)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/></svg></button>
  <button class="btn icon" id="bFlip" aria-label="Flip left or right" title="Flip hand (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18"/><path d="M8 7 3 12l5 5zM16 7l5 5-5 5z"/></svg></button>
  <button class="btn icon" id="bDel" aria-label="Delete" title="Delete (Del)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
  <span class="sep"></span>
  <button class="btn" id="bJoin" title="Connect two open ends with flex track"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18c6 0 6-12 18-12"/><circle cx="3" cy="18" r="1.5"/><circle cx="21" cy="6" r="1.5"/></svg><span class="lbl">Join with flex</span></button>
  <button class="btn" id="bUnits" title="Switch units"><span id="unitsLbl">inches</span></button>
  <button class="btn icon drawer-btn side" id="bSide" aria-label="Details"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4zM14 5v14"/></svg><span class="lbl">Details</span></button>
  <span class="file" id="fileLbl"></span>
  <input type="file" id="fOpen" accept=".scarm,.txt" hidden>
  <input type="file" id="fCal" accept=".scarm,.txt" hidden>
  <input type="file" id="fKey" accept=".json" hidden>
</header>
<div class="main">
  <aside id="parts">
    <input class="search" id="q" type="search" placeholder="Find a part, e.g. 836 or #6" aria-label="Find a part">
    <div id="palette"></div>
  </aside>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Layout canvas"></canvas>
    <div class="hint" id="hint"></div>
    <div class="zoom">
      <button class="btn" id="zIn" aria-label="Zoom in">+</button>
      <button class="btn" id="zFit" aria-label="Fit layout" title="Fit (0)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="btn" id="zOut" aria-label="Zoom out">&minus;</button>
    </div>
  </div>
  <aside id="side">
    <nav class="tabs" role="tablist">
      <button class="on" data-tab="insp">Inspect</button>
      <button data-tab="list">Parts list</button>
      <button data-tab="layers">Layers</button>
      <button data-tab="file">File</button>
    </nav>
    <section class="pane on" id="p-insp"></section>
    <section class="pane" id="p-list"></section>
    <section class="pane" id="p-layers"></section>
    <section class="pane" id="p-file"></section>
  </aside>
</div>
<footer class="status" id="status"></footer>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="colors" aria-hidden="true">
  <i id="c-surround" style="color:var(--surround)"></i><i id="c-board" style="color:var(--board)"></i><i id="c-grid" style="color:var(--grid)"></i><i id="c-grid2" style="color:var(--grid2)"></i>
  <i id="c-tie" style="color:var(--tie)"></i><i id="c-rail" style="color:var(--rail)"></i><i id="c-accent" style="color:var(--accent)"></i><i id="c-ink" style="color:var(--ink)"></i>
  <i id="c-fig" style="color:var(--fig)"></i><i id="c-bg" style="color:var(--bg)"></i><i id="c-ok" style="color:var(--ok)"></i><i id="c-panel" style="color:var(--panel)"></i>

<script>
/* Railbench core: .scarm file I/O, geometry, Atlas Code 100 library. DOM-free. */
const RB = (() => {
  const D2R = Math.PI / 180;
  const EOL = '\r\n';
  const TRUSTED_BASE = 75000;               // bytes of keystream verified across many files
  const RM_ATLAS = '  RM|16.5|87|1|2.5|28|2|2.85|0|Atlas|HO|0;0;-1;0|0';

  // ---------- bytes ----------
  function b64ToBytes(s) {
    const bin = atob(String(s).replace(/\s+/g, ''));
    const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  function bytesToB64(u) {
    let s = '';
    for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function bytesToLatin1(u) {
    let s = '';
    for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    return s;
  }
  function latin1ToBytes(s) {
    const u = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); u[i] = c < 256 ? c : 63; }
    return u;
  }

  // ---------- keystream ----------
  let KS = new Uint8Array(0), TRUSTED = TRUSTED_BASE;
  function initKeystream(b64) { KS = b64ToBytes(b64); TRUSTED = Math.min(TRUSTED_BASE, KS.length); }
  function applyExtension(ext) {           // ext: {b64, trusted}
    const e = b64ToBytes(ext.b64);
    if (e.length < KS.length) return false;
    for (let i = 0; i < TRUSTED_BASE; i++) if (e[i] !== KS[i]) return false;   // must agree with the verified part
    KS = e; TRUSTED = Math.max(TRUSTED, Math.min(ext.trusted, e.length));
    return true;
  }
  function keyInfo() { return { length: KS.length, trusted: TRUSTED, base: TRUSTED_BASE }; }
  function xor(data) {
    const out = new Uint8Array(data.length);
    for (let i = 0; i < data.length; i++) out[i] = data[i] ^ KS[i];
    return out;
  }

  // ---------- number formatting ----------
  function fmt(n, d = 4) {
    if (!isFinite(n)) return '0';
    let s = (+n).toFixed(d);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s === '-0' ? '0' : s;
  }
  const angDiff = (a, b) => Math.abs(((a - b) % 360 + 540) % 360 - 180);
  const norm360 = a => { a %= 360; if (a < 0) a += 360; if (Math.abs(a - 360) < 1e-9) a = 0; return a; };

  // ---------- file reading ----------
  const BODY_START = /^(BB\||LID\||T[A-Za-z0-9]+\|)/;
  function looksLikeBody(s) { return BODY_START.test(s); }

  function readFile(u8, name) {
    const text = bytesToLatin1(u8);
    const doc = { name: name || 'layout.scarm', warnings: [], kind: 'plain', mrv: '1.9.0', version: '', prefix: null, beyond: 0 };
    const ed = text.indexOf('--EDATA--');
    if (ed >= 0) {
      doc.kind = 'encrypted';
      const head = text.slice(0, ed);
      const m = head.match(/V=([^\r\n]*)/);
      doc.version = m ? m[1].trim() : '';
      const mm = doc.version.match(/MRV=([\d.]+)/);
      if (mm) doc.mrv = mm[1];
      let cipher;
      try { cipher = b64ToBytes(text.slice(ed + 9)); } catch (e) { throw new Error('The encrypted block is not valid base64, so the file looks damaged.'); }
      if (cipher.length > KS.length) {
        throw Object.assign(new Error(`This file is ${cipher.length.toLocaleString()} bytes, longer than the ${KS.length.toLocaleString()} bytes of key this editor knows. Use “Extend range” to teach it more, then open the file again.`), { code: 'too_long', size: cipher.length });
      }
      const plain = bytesToLatin1(xor(cipher));
      if (!looksLikeBody(plain.slice(7))) {
        throw new Error(`Decryption did not produce a SCARM layout (format “${doc.version}”). This may be a newer SCARM release with a different key.`);
      }
      doc.prefix = plain.slice(0, 7);
      doc.beyond = Math.max(0, cipher.length - TRUSTED);
      Object.assign(doc, parseBody(plain.slice(7)));
      if (doc.beyond > 0) doc.warnings.push(`The last ${doc.beyond.toLocaleString()} bytes are past the verified key range (${TRUSTED.toLocaleString()} bytes), so some text there may be decoded wrongly.`);
    } else {
      const lines = text.split(/\r?\n/);
      let i = 0; const pre = [];
      while (i < lines.length && !looksLikeBody(lines[i])) { pre.push(lines[i]); i++; }
      if (i >= lines.length) throw new Error('This does not look like a SCARM project file.');
      const v = pre.find(l => l.startsWith('V='));
      doc.version = v ? v.slice(2).trim() : '';
      Object.assign(doc, parseBody(lines.slice(i).join(EOL)));
    }
    doc.damaged = countDamaged(doc);
    return doc;
  }

  function parseBody(body) {
    const lines = body.split(/\r?\n/);
    const header = [], records = [];
    let eof = false, cur = null, i = 0;
    const recStart = l => /^T[A-Za-z0-9]+\|/.test(l);
    while (i < lines.length && !recStart(lines[i]) && !lines[i].startsWith('# ')) { header.push(lines[i]); i++; }
    for (; i < lines.length; i++) {
      const l = lines[i];
      if (l === '') { cur = null; continue; }
      if (l.startsWith('# SCARM EOF')) { eof = true; cur = null; continue; }
      if (l.startsWith('# CS=')) { records.push({ id: UID++, lines: [l] }); cur = null; continue; }
      if (cur && !recStart(l)) { cur.lines.push(l); continue; }
      cur = { id: UID++, lines: [l] }; records.push(cur);
    }
    while (header.length && header[header.length - 1] === '') header.pop();
    records.forEach(analyze);
    return { header, records, eof };
  }

  let UID = 1;
  function newRecord(lines) { const r = { id: UID++, lines }; analyze(r); return r; }

  function analyze(r) {
    const f = r.lines[0].split('|');
    r.type = r.lines[0].startsWith('# CS=') ? '#CS' : f[0]; r.f = f; r.sp = null; r.spIdx = -1; r.layer = 0;
    for (let k = 1; k < r.lines.length; k++) {
      const t = r.lines[k];
      if (t.startsWith('  SP|')) {
        const p = t.trim().split('|');
        if (p.length >= 4) { r.spIdx = k; r.sp = { x: +p[1], y: +p[2], a: +p[3], flag: p[4] ?? '0' }; }
      } else if (t.startsWith('  L#|')) r.layer = parseInt(t.split('|')[1]) || 0;
    }
    r.geom = null;
    return r;
  }

  function setSP(r, x, y, a) {
    const flag = r.sp ? r.sp.flag : '0';
    const line = `  SP|${fmt(x)}|${fmt(y)}|${fmt(norm360(a))}|${flag}`;
    if (r.spIdx >= 0) r.lines[r.spIdx] = line;
    else { r.lines.splice(Math.min(2, r.lines.length), 0, line); }
    analyze(r);
  }

  function serializeBody(doc) {
    let s = doc.header.length ? doc.header.join(EOL) + EOL + EOL : '';
    for (const r of doc.records) {
      if (r.type === '#CS' && doc.dirty) continue;
      s += r.lines.join(EOL) + EOL + EOL;
    }
    if (doc.eof || doc.dirty || !doc.records.length) s += '# SCARM EOF' + EOL;
    return s;
  }

  function newPrefix() {
    const d = String(Math.floor(Math.random() * 1000)).padStart(3, '0');
    return String.fromCharCode(0x96 ^ KS[0], 0x5e ^ KS[1]) + d + '\r\n';
  }

  // mode: 'encrypted' | 'plain'
  function writeFile(doc, mode) {
    const body = serializeBody(doc);
    if (mode === 'plain') {
      const v = 'V=0.9.33 beta';
      return { text: '# SCARM Project File' + EOL + EOL + v + EOL + EOL + body, size: body.length };
    }
    const plain = latin1ToBytes((doc.prefix || newPrefix()) + body);
    if (plain.length > TRUSTED) {
      return { error: 'too_long', size: plain.length, limit: TRUSTED };
    }
    const b64 = bytesToB64(xor(plain));
    return { text: '# SCARM Project File' + EOL + EOL + 'V=2010 MRV=' + (doc.mrv || '1.9.0') + EOL + EOL + '--EDATA--' + EOL + b64, size: plain.length };
  }

  function countDamaged(doc) {
    let bad = 0;
    for (const r of doc.records) {
      for (const l of r.lines) if (/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/.test(l)) { bad++; break; }
      if (r.type !== '#CS' && !/^T[A-Za-z0-9]+$/.test(r.type) && !/^[&A-Za-z]/.test(r.type)) bad++;
    }
    return bad;
  }

  // ---------- layers (LID lines) ----------
  function layers(doc) {
    const out = [];
    doc.header.forEach((l, idx) => {
      if (!l.startsWith('LID|')) return;
      const p = l.split('|');
      out.push({ id: +p[1], state: +p[2], name: p.slice(3).join('|') || (p[1] === '0' ? 'Base' : 'Layer ' + p[1]), idx });
    });
    return out;
  }
  function activeLayer(doc) { const a = layers(doc).find(l => l.state === 2); return a ? a.id : 0; }

  // ---------- board (BB line) ----------
  function board(doc) {
    const l = doc.header.find(x => x.startsWith('BB|'));
    if (!l) return null;
    const pts = [...l.matchAll(/\[(-?[\d.]+);(-?[\d.]+)\]/g)].map(m => [+m[1], +m[2]]);
    return pts.length >= 3 ? pts : null;
  }
  function setBoardRect(doc, w, h) {
    const line = `BB|[0;0][${fmt(w)};0][${fmt(w)};${fmt(h)}][0;${fmt(h)}]`;
    const i = doc.header.findIndex(x => x.startsWith('BB|'));
    if (i >= 0) doc.header[i] = line;
    else { doc.header.unshift(line, ''); }
  }

  // ---------- geometry ----------
  function arcPts(s, R, A, left, pts) {
    const sg = left ? -1 : 1, h = s.h * D2R;
    const cx = s.x - R * Math.sin(h) * sg, cy = s.y + R * Math.cos(h) * sg;
    const n = Math.max(2, Math.ceil(Math.abs(A) / 2.5));
    let x = s.x, y = s.y;
    for (let i = 1; i <= n; i++) {
      const nh = h + sg * A * D2R * i / n;
      x = cx + R * Math.sin(nh) * sg; y = cy - R * Math.cos(nh) * sg;
      pts.push([x, y]);
    }
    return { x, y, h: s.h + sg * A };
  }
  function linePts(s, L, pts) {
    const h = s.h * D2R, x = s.x + L * Math.cos(h), y = s.y + L * Math.sin(h);
    if (L) pts.push([x, y]);
    return { x, y, h: s.h };
  }
  // ops: ['L', len] | ['A', R, A, left]
  function walk(start, ops) {
    const pts = [[start.x, start.y]]; let s = { ...start }, len = 0;
    for (const o of ops) {
      if (o[0] === 'L') { s = linePts(s, o[1], pts); len += Math.abs(o[1]); }

  // A: start {x,y,h} heading into the new track. B: end point {x,y,h} heading of travel on arrival.
  function biarc(A, B) {
    const t1 = [Math.cos(A.h * D2R), Math.sin(A.h * D2R)], t2 = [Math.cos(B.h * D2R), Math.sin(B.h * D2R)];
    const v = [B.x - A.x, B.y - A.y];
    const dist = Math.hypot(v[0], v[1]); if (dist < 1) return null;
    const t = [t1[0] + t2[0], t1[1] + t2[1]];
    const vt = v[0] * t[0] + v[1] * t[1], tt = 2 * (1 - (t1[0] * t2[0] + t1[1] * t2[1]));
    let d;
    if (tt < 1e-9) { const vt2 = v[0] * t2[0] + v[1] * t2[1]; if (Math.abs(vt2) < 1e-9) return null; d = (v[0] ** 2 + v[1] ** 2) / (4 * vt2); }

      const turn = 2 * Math.atan2(cross, dot);            // signed heading change (radians, y-down)
      const R = L / (2 * Math.abs(Math.sin(turn / 2)));
      segs.push(['A', R, Math.abs(turn) / D2R, turn < 0]);  // negative turn = left on screen
      return h + turn / D2R;
    };
    const hm = arcTo([A.x, A.y], A.h, pm);
    arcTo(pm, hm, [B.x, B.y]);

  r.lines = r.lines.filter(l => !l.startsWith('  L#|'));
  if (layer) r.lines.push('  L#|' + layer);
  RB.analyze(r);
}
function placeNew(r, k = 0) {
  const target = S.activeEnd ? { ...S.activeEnd.e } : null;
  if (target) RB.attach(r, k, target);
  else RB.setSP(r, S.view.cx - 100, S.view.cy, 0);
  RB.insertRecords(S.doc, [r]);
  S.sel = new Set([r.id]);
  S.last = { id: r.id, target, k };
  advanceEnd(r, k);
}
function advanceEnd(r, k) {
  const n = RB.geom(r).ends.length;
  if (n < 2) { S.activeEnd = null; return; }
  const i = k === 0 ? 1 : 0;
  S.activeEnd = { rid: r.id, i, e: RB.geom(r).ends[i] };
}
function addPart(def) {
  if (!S.doc) return;
  pushUndo();
  placeNew(RB.makePiece(def, S.activeLayer));
  changed(); closeDrawers();
}
function cycleEnd() {
  const r = S.last && byId(S.last.id);
  if (!r || !S.last.target) return;
  const n = RB.geom(r).ends.length;
  pushUndo();
  S.last.k = (S.last.k + 1) % n;
  RB.attach(r, S.last.k, S.last.target); advanceEnd(r, S.last.k); changed();
}
function flipSel() {
  const rs = selRecs(); if (!rs.length) return;
  pushUndo(); let any = false;
  for (const r of rs) {
    if (!RB.flip(r)) continue; any = true;
    if (S.last && S.last.id === r.id && S.last.target) { RB.attach(r, S.last.k, S.last.target); advanceEnd(r, S.last.k); }
  }
  if (!any) { S.undo.pop(); toast('Only curves, flex track, turnouts and crossings can be flipped.'); return; }
  changed();
}
function selCenter(rs) {
  let b = [1e18, 1e18, -1e18, -1e18];
  for (const r of rs) {
    const g = RB.geom(r);
    if (g.track) { b[0] = Math.min(b[0], g.box[0]); b[1] = Math.min(b[1], g.box[1]); b[2] = Math.max(b[2], g.box[2]); b[3] = Math.max(b[3], g.box[3]); }
    else { const f = RB.figure(r); if (f && f.kind === 'text') { b[0] = Math.min(b[0], f.x); b[1] = Math.min(b[1], f.y); b[2] = Math.max(b[2], f.x); b[3] = Math.max(b[3], f.y); } }
  }
  return [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2];
}
function moveRec(r, ox, oy, rot, dx, dy) { if (r.sp) RB.transformSP(r, ox, oy, rot, dx, dy); else RB.transformFigure(r, ox, oy, rot, dx, dy); }
function rotateSel(deg) {
  const rs = selRecs(); if (!rs.length) return;
  pushUndo();
  const [ox, oy] = rs.length === 1 && rs[0].sp ? [rs[0].sp.x, rs[0].sp.y] : selCenter(rs);
  for (const r of rs) moveRec(r, ox, oy, deg, 0, 0);
  S.last = null; changed();
}
function nudge(dx, dy) { const rs = selRecs(); if (!rs.length) return; pushUndo(); for (const r of rs) moveRec(r, 0, 0, 0, dx, dy); changed(); }
function deleteSel() {
  if (!S.sel.size) return;
  pushUndo();
  S.doc.records = S.doc.records.filter(r => !S.sel.has(r.id));
  S.sel = new Set(); S.last = null; changed();
}
function duplicateSel() {
  const rs = selRecs(); if (!rs.length) return;
  pushUndo();
  const copies = rs.map(r => { const c = RB.newRecord(r.lines.slice()); moveRec(c, 0, 0, 0, 30, 30); return c; });
  RB.insertRecords(S.doc, copies); S.sel = new Set(copies.map(c => c.id)); S.last = null; changed();
}
function joinEnds(a, b) {
  const A = { x: a.e.x, y: a.e.y, h: a.e.h }, B = { x: b.e.x, y: b.e.y, h: b.e.h + 180 };
  const segs = RB.biarc(A, B);
  if (!segs || !segs.length) { toast('Those two ends cannot be joined with a smooth flex curve. Try ends that face each other.'); return; }
  pushUndo();
  const rm = (a.r.lines.find(l => l.startsWith('  RM|')) || RB.RM_ATLAS);
  const fx = RB.flexPiece(segs, S.activeLayer, rm); RB.setSP(fx, A.x, A.y, A.h);
  RB.insertRecords(S.doc, [fx]); S.sel = new Set([fx.id]); S.activeEnd = null; S.last = null;
  const minR = Math.min(...segs.filter(s => s[0] === 'A').map(s => s[1]), Infinity);
  const len = RB.geom(fx).len;
  toast(`Flex added: ${fmtLen(len, 1)} long` + (isFinite(minR) ? `, tightest radius ${fmtLen(minR, 1)}` + (minR < 18 * IN ? ' (tighter than 18″)' : '') : ', straight') + '.');
  changed();
}
function addFlex(kind, a, b, left) {
  pushUndo();
  const segs = kind === 'S' ? [['L', a]] : [['A', b, a, left]];
  const r = RB.flexPiece(segs, S.activeLayer);
  placeNew(r); changed(); closeDialog();
}

// ---------- pointer input ----------
function evPos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', e => {
  if (!S.doc) return;
  cv.setPointerCapture(e.pointerId);
  const [px, py] = evPos(e); S.pointers.set(e.pointerId, [px, py]);
  if (S.pointers.size === 2) {
    const [a, b] = [...S.pointers.values()];
    S.pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), mx: (a[0] + b[0]) / 2, my: (a[1] + b[1]) / 2 };
    if (S.drag && S.drag.kind === 'move' && S.drag.moved) restore(S.drag.before);
    S.drag = null; return;
  }
  const [wx, wy] = s2w(px, py);
  if (e.button === 1 || e.button === 2) { S.drag = { kind: 'pan', px, py, moved: true }; return; }
  if (S.mode && S.mode.kind === 'join') {
    const o = endAt(wx, wy);
    if (!o) { toast('Click an open rail end (the red marks).'); return; }
    if (!S.mode.first) { S.mode.first = o; renderHint(); draw(); return; }
    if (o.r === S.mode.first.r && o.i === S.mode.first.i) return;
    const first = S.mode.first; S.mode = null; renderHint(); renderButtons(); joinEnds(first, o); return;
  }
  const o = endAt(wx, wy);
  const r = pieceAt(wx, wy);
  if (o && (!r || Math.hypot(o.e.x - wx, o.e.y - wy) < Math.max(10, 10 / S.view.z))) {
    S.activeEnd = { rid: o.r.id, i: o.i, e: o.e }; S.last = null; renderHint(); draw();
    S.drag = { kind: 'none' }; return;
  }
  if (r) {
    if (e.shiftKey || e.ctrlKey || e.metaKey) { S.sel.has(r.id) ? S.sel.delete(r.id) : S.sel.add(r.id); }
    else if (!S.sel.has(r.id)) S.sel = new Set([r.id]);
    S.drag = { kind: 'move', wx, wy, px, py, moved: false, before: snap(), orig: new Map(selRecs().map(x => [x.id, x.lines.slice()])) };
    renderSide(); draw(); return;
  }
  S.drag = e.shiftKey ? { kind: 'box', px, py, qx: px, qy: py, moved: false } : { kind: 'pan', px, py, moved: false };
});
cv.addEventListener('pointermove', e => {
  const [px, py] = evPos(e);
  S.mouse = s2w(px, py);
  if (S.pointers.has(e.pointerId)) S.pointers.set(e.pointerId, [px, py]);
  if (S.pinch && S.pointers.size === 2) {
    const [a, b] = [...S.pointers.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]), mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    S.view.cx -= (mx - S.pinch.mx) / S.view.z; S.view.cy -= (my - S.pinch.my) / S.view.z;
    zoomAt(d / S.pinch.d, mx, my); S.pinch = { d, mx, my }; return;
  }
  const d = S.drag;
  if (!d) {
    const r = S.doc ? pieceAt(...S.mouse) : null, id = r ? r.id : null;
    const o = S.doc ? endAt(...S.mouse) : null;
    cv.style.cursor = S.mode ? (o ? 'pointer' : 'crosshair') : o ? 'pointer' : r ? 'move' : 'default';
    if (id !== S.hoverId) { S.hoverId = id; draw(); } else renderStatus();
    return;
  }
  if (d.kind === 'pan') {
    if (Math.hypot(px - d.px, py - d.py) > 3) d.moved = true;
    S.view.cx -= (px - d.px) / S.view.z; S.view.cy -= (py - d.py) / S.view.z; d.px = px; d.py = py; draw();
  } else if (d.kind === 'box') {
    d.qx = px; d.qy = py; d.moved = true; draw();
  } else if (d.kind === 'move') {
    if (!d.moved && Math.hypot(px - d.px, py - d.py) < 4) return;
    d.moved = true;
    const [wx, wy] = s2w(px, py), dx = wx - d.wx, dy = wy - d.wy;
    const rs = selRecs();
    for (const r of rs) { r.lines = d.orig.get(r.id).slice(); RB.analyze(r); moveRec(r, 0, 0, 0, dx, dy); }
    snapGroup(rs, e.altKey);
    draw();
  }
});
function snapGroup(rs, off) {
  if (off) return;
  const ids = new Set(rs.map(r => r.id));
  const others = RB.connections(S.doc.records.filter(r => !ids.has(r.id) && visibleRec(r))).filter(o => !o.conn);
  const mine = RB.connections(rs).filter(o => !o.conn);

  let best = null, bd = tol;
  for (const m of mine) for (const o of others) {
    const dist = Math.hypot(m.e.x - o.e.x, m.e.y - o.e.y); if (dist >= bd) continue;
    let rot = ((o.e.h + 180 - m.e.h) % 360 + 540) % 360 - 180;
    if (Math.abs(rot) > 30) continue;
    bd = dist; best = { m, o, rot };
  }
  if (!best) return;
  const { m, o, rot } = best;
  for (const r of rs) moveRec(r, m.e.x, m.e.y, rot, o.e.x - m.e.x, o.e.y - m.e.y);
}
function endPointer(e) {

  const d = S.drag; S.drag = null;

  else if (d.kind === 'box' && d.moved) {
    const [ax, ay] = s2w(Math.min(d.px, d.qx), Math.min(d.py, d.qy)), [bx, by] = s2w(Math.max(d.px, d.qx), Math.max(d.py, d.qy));

cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => { e.preventDefault(); const [px, py] = evPos(e); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016)), px, py); }, { passive: false });
cv.addEventListener('pointerleave', () => { S.mouse = null; if (S.hoverId) { S.hoverId = null; draw(); } });

// palette drag (ghost placement)
function paletteDown(e, def) {
  if (!S.doc) return;
  e.preventDefault();
  S.ghost = { def, r: RB.makePiece(def, S.activeLayer), sx: e.clientX, sy: e.clientY, dragging: false, shown: false, snapEnd: null };
}
window.addEventListener('pointermove', e => {
  const g = S.ghost; if (!g) return;
  if (!g.dragging && Math.hypot(e.clientX - g.sx, e.clientY - g.sy) > 6) { g.dragging = true; closeDrawers(); }
  if (!g.dragging) return;
  const rc = cv.getBoundingClientRect();
  const inside = e.clientX >= rc.left && e.clientX <= rc.right && e.clientY >= rc.top && e.clientY <= rc.bottom;
  g.shown = inside;
  if (inside) {
    const [wx, wy] = s2w(e.clientX - rc.left, e.clientY - rc.top);
    let best = null, bd = Math.max(40, 40 / S.view.z);
    for (const o of S.ends) { if (o.conn) continue; const d = Math.hypot(o.e.x - wx, o.e.y - wy); if (d < bd) { bd = d; best = o; } }

});
window.addEventListener('pointerup', () => {
  const g = S.ghost; if (!g) return;
  S.ghost = null;
  if (!g.dragging) { addPart(g.def); return; }
  if (!g.shown) { draw(); return; }
  pushUndo();
  RB.insertRecords(S.doc, [g.r]); S.sel = new Set([g.r.id]);
  if (g.snapEnd) { S.last = { id: g.r.id, target: { ...g.snapEnd.e }, k: 0 }; advanceEnd(g.r, 0); }
  else { S.last = null; advanceEnd(g.r, 0); }

// ---------- keyboard ----------
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea,select,dialog')) return;
  const mod = e.ctrlKey || e.metaKey, k = e.key;
  if (mod && (k === 'z' || k === 'Z')) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && (k === 'y' || k === 'Y')) { e.preventDefault(); redo(); return; }
  if (mod && (k === 'd' || k === 'D')) { e.preventDefault(); duplicateSel(); return; }
  if (mod && (k === 'a' || k === 'A')) { e.preventDefault(); S.sel = new Set(S.doc.records.filter(visibleRec).map(r => r.id)); renderSide(); draw(); return; }
  if (mod && (k === 's' || k === 'S')) { e.preventDefault(); openSave(); return; }
  if (mod && (k === 'o' || k === 'O')) { e.preventDefault(); $('#fOpen').click(); return; }
  if (mod) return;
  if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); deleteSel(); }
  else if (k === 'r' || k === 'R') rotateSel(e.shiftKey ? -15 : 15);
  else if (k === 'f' || k === 'F') flipSel();
  else if (k === 'Tab') { if (S.last) { e.preventDefault(); cycleEnd(); } }
  else if (k === 'Escape') { S.mode = null; S.activeEnd = null; S.sel = new Set(); S.last = null; renderHint(); renderSide(); renderButtons(); draw(); }
  else if (k === 'j' || k === 'J') startJoin();
  else if (k === '0') fit();
  else if (k === '+' || k === '=') zoomAt(1.25, W / 2, H / 2);
  else if (k === '-' || k === '_') zoomAt(0.8, W / 2, H / 2);
  else if (k === '?') showHelp();
  else if (k.startsWith('Arrow')) {
    e.preventDefault(); const st = (e.shiftKey ? 10 : 1) * (S.units === 'in' ? IN / 16 : 1);
    nudge(k === 'ArrowLeft' ? -st : k === 'ArrowRight' ? st : 0, k === 'ArrowUp' ? -st : k === 'ArrowDown' ? st : 0);
  }
});

// ---------- palette ----------
function icon(def) {
  const r = def.flex ? RB.flexPiece([['L', 300]], 0) : RB.makePiece(def, 0);
  const g = RB.geom(r); if (!g.track) return '';
  const [a, b, c, d] = g.box, w = Math.max(c - a, 1), h = Math.max(d - b, 1);
  const sc = Math.min(50 / w, 22 / h), ox = 29 - (a + c) / 2 * sc, oy = 15 - (b + d) / 2 * sc;
  const path = g.routes.map(p => 'M' + p.map(q => `${(q[0] * sc + ox).toFixed(1)} ${(q[1] * sc + oy).toFixed(1)}`).join('L')).join('');
  return `<svg viewBox="0 0 58 30" aria-hidden="true"><path d="${path}" fill="none" stroke="${C.ink}" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round"/><path d="${path}" fill="none" stroke="${C.panel}" stroke-width="1.6"/></svg>`;
}
let PAL = [];
function renderPalette() {
  const q = $('#q').value.trim().toLowerCase();
  const groups = ['Straight', 'Curve', 'Turnout', 'Crossing'];
  const items = [...RB.LIB, ...S.learned];
  PAL = items;
  const match = d => !q || (d.name + ' ' + d.part + ' ' + (d.brand || '')).toLowerCase().includes(q);
  let h = '';
  if (S.learned.length && S.learned.some(match)) {
    h += `<div class="grp">In this file</div>`;
    S.learned.forEach(d => { if (match(d)) h += partBtn(d, `${d.brand || d.type.replace(/^T|Rail$/g, '')}${d.part ? ' · ' + d.part : ''}`); });
  }
  for (const g of groups) {
    const list = RB.LIB.filter(d => d.g === g && match(d)); if (!list.length) continue;
    h += `<div class="grp">Atlas Code 100 · ${g === 'Curve' ? 'Curves' : g === 'Straight' ? 'Straights' : g + 's'}</div>`;
    list.forEach(d => h += partBtn(d, d.part));
  }
  if (!q || 'flex 168'.includes(q) || q.includes('flex')) {
    h += `<div class="grp">Atlas Code 100 · Flex 168</div>`;
    h += `<button class="part" id="flexAdd">${icon({ flex: true })}<span><b>Flex track…</b><i>straight or curve, any length</i></span></button>`;
    h += `<button class="part" id="flexJoin">${icon({ flex: true })}<span><b>Join two ends</b><i>fits a smooth flex curve</i></span></button>`;
  }
  if (!h) h = `<p class="muted small">No part matches “${esc(q)}”.</p>`;
  $('#palette').innerHTML = h;
}
function partBtn(d, sub) {
  return `<button class="part" data-key="${d.key}" title="Click to add at the selected rail end, or drag onto the layout">${icon(d)}<span><b>${esc(d.name)}</b><i>${esc(sub)}</i></span></button>`;
}
$('#palette').addEventListener('pointerdown', e => {
  const b = e.target.closest('.part[data-key]'); if (!b) return;
  const d = PAL.find(x => x.key === b.dataset.key); if (d) paletteDown(e, d);

$('#palette').addEventListener('click', e => {

$('#q').addEventListener('input', renderPalette);

// ---------- side panels ----------

      openDialog(`<h2>File is larger than the key range</h2><p>${esc(err.message)}</p><div class="row"><button class="btn primary" id="cx">Extend range…</button><button class="btn" id="dx">Cancel</button></div>`);
      $('#dx').onclick = closeDialog; $('#cx').onclick = calibDialog;
    } else openDialog(`<h2>Could not open ${esc(name)}</h2><p>${esc(err.message)}</p><div class="row"><button class="btn primary" id="dx">Close</button></div>`), $('#dx').onclick = closeDialog;
  }
}
$('#bOpen').onclick = () => $('#fOpen').click();
$('#fOpen').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if (f) openBytes(new Uint8Array(await f.arrayBuffer()), f.name.replace(/\.txt$/i, '')); });
stage.addEventListener('dragover', e => { e.preventDefault(); });
stage.addEventListener('drop', async e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) openBytes(new Uint8Array(await f.arrayBuffer()), f.name.replace(/\.txt$/i, '')); });
$('#bNew').onclick = () => {
  const u = uLabel(), dw = S.units === 'in' ? 96 : 2440, dh = S.units === 'in' ? 48 : 1220;
  openDialog(`<h2>New layout</h2>${S.doc && S.doc.dirty ? '<p class="warnbox">Your current changes are kept as a draft you can restore.</p>' : ''}
    <div class="fields" style="grid-template-columns:1fr 1fr"><label class="f">Board width (${u})<input class="n" id="nw" type="number" step="any" value="${dw}"></label><label class="f">Board depth (${u})<input class="n" id="nh" type="number" step="any" value="${dh}"></label></div>
    <div class="row"><button class="btn primary" id="nok">Create</button><button class="btn" id="dx">Cancel</button></div>`);
  $('#dx').onclick = closeDialog;
  $('#nok').onclick = () => { const w = parseFloat($('#nw').value) * U(), h = parseFloat($('#nh').value) * U(); if (!(w > 0 && h > 0)) return; if (S.doc && S.doc.dirty) saveDraft(); loadDoc(emptyDoc(w, h)); closeDialog(); };
};
function restoreDraft() {
  const d = S.pendingDraft; if (!d) return;
  const doc = { name: d.name, kind: d.kind, mrv: d.mrv, version: d.version, prefix: d.prefix, header: d.header, records: d.recs.map(l => RB.newRecord(l)), eof: d.eof, warnings: [], beyond: 0, damaged: 0, dirty: true };
  S.pendingDraft = null; loadDoc(doc); S.doc.dirty = true; renderFileLabel(); renderStatus(); renderHint();
}

// ---------- toolbar ----------
$('#bSave').onclick = openSave;
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo;
$('#bRot').onclick = () => rotateSel(15); $('#bFlip').onclick = flipSel; $('#bDel').onclick = deleteSel;
$('#bJoin').onclick = startJoin;
$('#bUnits').onclick = () => { S.units = S.units === 'in' ? 'mm' : 'in'; store.set('railbench-units', S.units); renderButtons(); renderSide(); draw(); };
$('#zIn').onclick = () => zoomAt(1.3, W / 2, H / 2); $('#zOut').onclick = () => zoomAt(1 / 1.3, W / 2, H / 2); $('#zFit').onclick = fit;
function closeDrawers() { $('#parts').classList.remove('open'); $('#side').classList.remove('open'); }
$('#bParts').onclick = () => { $('#side').classList.remove('open'); $('#parts').classList.toggle('open'); };
$('#bSide').onclick = () => { $('#parts').classList.remove('open'); $('#side').classList.toggle('open'); };

// ---------- boot ----------
if (location.hash === '#debug') window.__rb = { S, w2s, fit };
function start(data) {
  readColors();
  resize();
  try { const d = JSON.parse(store.get('railbench-draft') || 'null'); if (d && d.recs && d.recs.length) S.pendingDraft = d; } catch (e) {}
  if (data && data.doc) {
    const d = data.doc;
    loadDoc({ ...d, records: d.recs.map(l => RB.newRecord(l)), warnings: [], beyond: 0, damaged: 0 });
    S.doc.dirty = !!d.dirty; S.pendingDraft = null;
  } else loadDoc(sampleDoc(), { sample: true });
  renderHint();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
  window.claude.hot.snapshot(() => S.doc ? { doc: { name: S.doc.name, kind: S.doc.kind, mrv: S.doc.mrv, version: S.doc.version, prefix: S.doc.prefix, header: S.doc.header, recs: S.doc.records.map(r => r.lines), eof: S.doc.eof, dirty: S.doc.dirty } } : {});
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
}

</script>
</body>
</html>
