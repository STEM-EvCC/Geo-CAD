<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geo-CAD 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a friendly, working CAD bench for nervous first-time engineers; calm, exact, never cute in the way.
   IDEA: a makerspace drafting table: blue pencil (still moving) turns to black ink (decided), orange is the laser's mark.
   PICTURE: the 3D viewport itself, filling the screen, with the part on a soft drafting-paper grid.
   COLOUR and TYPE: deep harbor navy chrome, white work surfaces, sketch blue #1f6fd1, ink black, laser orange #f28c28; Atkinson Hyperlegible throughout.
   LAYOUT: top bar, labeled tool ribbon, feature list left, viewport right with a floating feature dialog; stacks tighter below 900px. */
:root{color-scheme:light;--navy:#13324a;--navy2:#1d4463;--ink:#141a21;--muted:#5b6b7c;--line:#d9e0e8;--panel:#f4f6f9;--white:#fff;--blue:#1f6fd1;--orange:#f28c28;--orange2:#fde7cf;--red:#d63b3b;--green:#2f9e44;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:14px/1.4 var(--font);color:var(--ink);background:var(--panel);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
code{background:#eef2f6;border-radius:4px;padding:0 4px;font-size:.92em}
kbd{font:600 11px/1 var(--font);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 5px;background:#fff;color:var(--muted);margin-left:auto}
svg.ic{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;height:100vh;height:100dvh}
#top{grid-row:1}#toolbar{grid-row:2}#optbar{grid-row:3}#main{grid-row:4}#status{grid-row:5}
/* top bar */
#top{display:flex;align-items:center;gap:12px;padding:6px 12px;background:var(--navy);color:#fff}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand b{font-size:17px;letter-spacing:.2px}.brand .sub{font-size:12px;color:#b8cbe0;border-left:1px solid #3c6385;padding-left:8px}
.logo svg{width:26px;height:26px}
#docName{background:var(--navy2);border:1px solid #2f5a7f;color:#fff;border-radius:6px;padding:5px 9px;width:200px;font-weight:700}
#docName:focus{outline:2px solid var(--orange);outline-offset:1px}
#top .tb{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
#top .tb button{display:flex;align-items:center;gap:5px;background:none;border:1px solid transparent;color:#e5eef7;border-radius:6px;padding:5px 8px;min-height:34px}
#top .tb button svg.ic{width:18px;height:18px}
#top .tb button:hover{background:var(--navy2);border-color:#2f5a7f}
#top .tb button:disabled{opacity:.4;cursor:default;background:none;border-color:transparent}
#top .tb .guide{background:var(--orange);color:#1b1206;font-weight:700}
#top .tb .guide:hover{background:#f6a04f;border-color:#f6a04f}
/* toolbar */
#toolbar{display:flex;align-items:stretch;gap:0;background:var(--white);border-bottom:1px solid var(--line);padding:4px 6px;overflow-x:auto;scrollbar-width:thin}
#toolbar.sk{background:#f3f8ff;border-bottom-color:#c7dcf5}
.tg{display:flex;gap:1px;padding:0 4px;border-right:1px solid var(--line);flex:none;align-items:stretch;position:relative}
.tg.rules{padding-top:0}
.tgcap{position:absolute;left:6px;top:-3px;font-size:9.5px;color:#7489a0;letter-spacing:.3px}
.tool.ico{min-width:32px;padding:12px 2px 4px}
#toolbar.sk .tool:not(.ico){min-width:48px}
.tg:last-child,.tg.right{border-right:0}.tg.right{margin-left:auto;border-left:1px solid var(--line)}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:54px;padding:4px 3px 3px;border:1px solid transparent;border-radius:7px;background:none;color:#213243}
.tool span{font-size:10.5px;line-height:1.1;white-space:nowrap;color:#3b4b5c}
.tool:hover{background:#eef3f8;border-color:var(--line)}
.tool.on{background:var(--orange2);border-color:var(--orange);color:#7a3d00}
.tool.on span{color:#7a3d00}
.tool:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.tool.ok{background:#e3f4e8;color:#17632b;border-color:#a9dcb6}.tool.ok span{color:#17632b;font-weight:700}
.tool.ok:hover{background:#cfeed8}
.tool.no{color:#8b2a2a}.tool.no span{color:#8b2a2a}
#optbar{display:flex;gap:16px;align-items:center;padding:5px 14px;background:#f3f8ff;border-bottom:1px solid #c7dcf5;font-size:13px;color:#2c4057;flex-wrap:wrap}
#optbar input[type=number],#optbar input[type=text]{width:72px;padding:3px 6px;border:1px solid #b9c9db;border-radius:5px;margin-left:5px;font-size:14px}
#optbar .chk{display:flex;align-items:center;gap:5px}
.obr{margin-left:auto;display:flex;gap:6px}
.obtn{display:inline-flex;align-items:center;gap:5px;border:1px solid #b9c9db;background:#fff;border-radius:7px;padding:4px 10px;font-weight:700;font-size:13px;min-height:32px}
.obtn svg.ic{width:17px;height:17px}
.obtn.ok{background:var(--green);border-color:var(--green);color:#fff}.obtn.ok:hover{background:#27863a}
.obtn.no{color:#8b2a2a}
/* main */
#main{display:grid;grid-template-columns:286px minmax(0,1fr);min-height:0}
#left{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel);overflow:auto}
.panel{padding:8px 10px 10px;border-bottom:1px solid var(--line)}
.panel.grow{flex:1 1 auto}
#varsP{max-height:46%;overflow:auto;flex:none}
.panel h2{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px;font-size:12px;text-transform:none;letter-spacing:.3px;color:var(--muted);font-weight:700}
.panel h2 button{display:flex;align-items:center;gap:3px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 7px;font-size:12px;color:var(--ink)}
.panel h2 button svg.ic{width:15px;height:15px}
.vempty,.tempty{font-size:12.5px;color:var(--muted);padding:2px 2px 4px}
.vrow{display:grid;grid-template-columns:12px minmax(0,1fr) auto 26px;grid-template-areas:"h n o d" ". x x x";align-items:center;column-gap:4px;row-gap:3px;padding:5px 4px 6px;border-radius:7px;margin-bottom:2px}
.vrow:hover,.vrow:focus-within{background:#e9eff6}
.vrow input{border:1px solid transparent;border-radius:5px;padding:2px 5px;background:transparent;font-size:13.5px;width:100%}
.vrow input:hover{border-color:var(--line);background:#fff}
.vrow input:focus{outline:2px solid var(--blue);outline-offset:0;border-color:transparent;background:#fff}
.vh{grid-area:h;color:#7b8da0;font-weight:700;text-align:center}
.vrow .vname{grid-area:n;font-weight:700;color:#1d4f8f}
.vrow .vexpr{grid-area:x;border-color:var(--line);background:#fff;font-size:13px}
.vval{grid-area:o;font-size:13px;text-align:right;color:#24364a;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700;padding-left:4px}
.vval::before{content:"= ";color:#8a99a8;font-weight:400}
.veq{display:none}
.vrow.bad .vexpr{border-color:var(--red);background:#fff4f4}.vrow.bad .vval{color:var(--red)}
.vdel{grid-area:d;border:0;background:none;color:#8a99a8;padding:2px;border-radius:5px;opacity:.55}.vrow:hover .vdel{opacity:1}.vdel:hover{color:var(--red);background:#fde8e8}
.vdel svg.ic{width:16px;height:16px}
#tree{display:flex;flex-direction:column;gap:1px}
.trow{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;cursor:default;border:1px solid transparent;user-select:none}
.trow svg.ic{width:18px;height:18px;color:#3d5a78}
.trow .tn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow:hover{background:#e8eef5}
.trow.sel{background:var(--orange2);border-color:#f6c38f}
.trow.std .tn{color:#3f5368}
.trow.rolled,.trow.supp{opacity:.45}.trow.supp .tn{text-decoration:line-through}
.trow.err .tn{color:var(--red)}
.trow.pickable{border-style:dashed;border-color:#f2a35a;cursor:pointer}
.trow.picked{background:var(--orange);color:#fff}.trow.picked svg.ic{color:#fff}
.trow.editing{background:#dcebff;border-color:#9fc3ee}
.ud{color:var(--blue);font-style:normal;font-weight:700}
.tbad,.twarn{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;font-size:11px}
.twarn{background:#e9a400}
.teye{border:0;background:none;padding:2px;border-radius:5px;color:#7d8da0;display:grid;place-items:center}
.teye:hover{background:#dde6f0;color:var(--ink)}.teye svg.ic{width:16px;height:16px}
.rollbar{margin:3px 0;padding:2px 8px;border-radius:5px;background:repeating-linear-gradient(45deg,#2b6cd4,#2b6cd4 6px,#3a7be0 6px,#3a7be0 12px);color:#fff;font-size:11px;font-weight:700;cursor:ns-resize;user-select:none;touch-action:none}
.rollbar.end{opacity:.55}.rollbar.drag{opacity:1;box-shadow:0 4px 12px rgba(0,0,0,.25);position:relative;z-index:3}
.prow{display:grid;grid-template-columns:22px minmax(0,1fr) auto 24px 24px;gap:6px;align-items:center;padding:3px 2px}
.pcol{width:20px;height:20px;border:1px solid var(--line);border-radius:5px;padding:0;background:none}
.pv{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
/* viewport */
#view{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#fbfdff 0%,#eef3f8 55%,#dfe7ef 100%);touch-action:none}
#view canvas{position:absolute;inset:0}
#view canvas.ov{z-index:2}
#boot{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:15px;z-index:5;padding:20px}
#dlg{position:absolute;left:12px;top:12px;width:300px;max-height:calc(100% - 24px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(19,50,74,.18);z-index:4;padding:10px 12px 12px}
#card{position:absolute;right:12px;top:120px;width:300px;max-height:calc(100% - 132px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(19,50,74,.16);z-index:4;padding:10px 12px 12px}
.dh{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:15px}
.dh svg.ic{color:var(--navy2)}
.dh .dhelp,.dh .x{margin-left:auto;border:0;background:none;color:var(--muted);border-radius:6px;padding:3px}
.dh .x svg.ic,.dh .dhelp svg.ic{width:18px;height:18px}.dh .dhelp:hover,.dh .x:hover{background:#eef2f6;color:var(--ink)}
.dp{color:var(--muted);font-size:13px;margin:4px 0 8px}
.fl{display:block;font-size:12.5px;color:#405366;font-weight:700;margin:8px 0 3px}
.fl select,.fl input[type=text]{width:100%;margin-top:3px;padding:6px 8px;border:1px solid #c4d0dc;border-radius:6px;background:#fff;font-weight:400;font-size:14px}
.fld{border:1.5px solid #d6dee7;border-radius:8px;padding:6px 8px;margin:8px 0;cursor:pointer;background:#fafbfd}
.fld .fl{margin:0 0 2px}
.fld .fv{font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.fld.act{border-color:var(--orange);background:#fff8f0;box-shadow:0 0 0 3px rgba(242,140,40,.15)}
.fh{font-size:12px;color:#8a4b0f;margin-top:4px}
.fsub{font-size:11.5px;color:var(--muted);margin-left:auto}
.chip2{display:inline-flex;align-items:center;gap:3px;background:var(--orange2);border:1px solid #f6c38f;border-radius:12px;padding:1px 4px 1px 8px;font-size:12.5px}
.chip2 button{border:0;background:none;padding:0 3px;font-weight:700;color:#8a4b0f}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:0;border:1px solid #c4d0dc;border-radius:7px;overflow:hidden;margin:6px 0}
.seg button{border:0;border-right:1px solid #c4d0dc;background:#fff;padding:6px 2px;font-size:13px;min-height:34px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff;font-weight:700}
.opnote{font-size:12px;color:var(--muted);margin:-2px 0 6px}
.dragtip{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#8a4b0f;background:#fff4e8;border-radius:6px;padding:4px 8px;margin:6px 0}
.dragtip svg.ic{width:16px;height:16px;color:#f28c28}
.ex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;margin-top:3px}
.ex input{padding:6px 8px;border:1px solid #c4d0dc;border-radius:6px;font-size:15px;font-weight:400}
.ex input:focus{outline:2px solid var(--blue);outline-offset:0}
.ex output{font-size:12.5px;color:#24364a;font-weight:400;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.ex output.bad{color:var(--red)}
.flip{display:flex;align-items:center;gap:6px;border:1px solid #c4d0dc;background:#fff;border-radius:7px;padding:5px 10px;margin:8px 0;font-size:13px}
.flip svg.ic{width:16px;height:16px}.flip.on{background:#eaf2ff;border-color:#9fc3ee}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;margin:8px 0}
.chk input{width:16px;height:16px;accent-color:var(--navy)}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:6px 0}
.row3 button{border:1px solid #c4d0dc;background:#fff;border-radius:7px;padding:6px 4px;font-size:13px;min-height:34px}
.row3 button:hover{background:#eef3f8}
.derr{font-size:12.5px;margin:6px 0 0;min-height:0}
.derr.bad{color:var(--red);font-weight:700}.derr.warn{color:#9a6500}
.dfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:5px;border:1px solid #c4d0dc;background:#fff;border-radius:7px;padding:7px 14px;font-weight:700;min-height:38px}
.btn svg.ic{width:17px;height:17px}
.btn.ok,.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.ok:hover,.btn.primary:hover{background:#27863a}
.btn.no{color:#8b2a2a}.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.big{display:flex;align-items:baseline;gap:8px;margin:8px 0 4px}.big span{font-size:30px;font-weight:700;color:var(--navy)}.big small{color:var(--muted)}
.mt{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
.mt td{padding:4px 2px;border-bottom:1px solid #edf1f5}.mt td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.mt.sm{font-size:12px}
.note{font-size:12px;color:#405366;background:#f4f7fa;border-radius:6px;padding:6px 8px;margin-top:6px}
input[type=range]{width:100%;accent-color:var(--orange)}
#toasts{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:6;pointer-events:none;width:min(560px,90%)}
.toast{background:var(--navy);color:#fff;padding:8px 14px;border-radius:9px;font-size:13.5px;box-shadow:0 6px 18px rgba(0,0,0,.2);transition:opacity .4s,transform .4s;text-align:center}
.toast.bad{background:#a12727}.toast.out{opacity:0;transform:translateY(6px)}
.dimbox{position:absolute;z-index:5;width:220px}
.dimbox input{width:130px;padding:4px 7px;border:2px solid var(--blue);border-radius:6px;font-size:15px;font-weight:700;background:#fff;box-shadow:0 4px 14px rgba(31,111,209,.25)}
.dimbox input:focus{outline:none}
.dimmsg{margin-top:3px;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:#24364a;width:max-content;max-width:240px}
.dimmsg.bad{color:var(--red);border-color:#f2b8b8}
#tip{position:fixed;z-index:20;width:290px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 28px rgba(19,50,74,.2);padding:10px 12px;font-size:13px;pointer-events:none}
.tip-h,.tcard .tip-h{display:flex;align-items:center;gap:7px;font-size:14px}
.tip-h svg.ic{color:var(--navy2)}
#tip p,.tcard p{margin:6px 0}
#tip ol,.tcard ol{margin:4px 0 4px;padding-left:20px}
#tip li,.tcard li{margin:2px 0}
.tip-os{font-size:12px;color:var(--muted);margin-top:4px}
/* status bar */
#status{display:flex;align-items:center;gap:12px;padding:4px 12px;background:#fff;border-top:1px solid var(--line);font-size:12.5px;color:#3b4b5c;min-height:30px}
#hint{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#skStatus{display:flex;gap:6px}
.chip{border-radius:12px;padding:2px 9px;font-weight:700;font-size:12px;white-space:nowrap}
.chip.def{background:var(--ink);color:#fff}.chip.free{background:#e3eefc;color:var(--blue)}.chip.bad{background:#fde8e8;color:var(--red)}
#status label{display:flex;align-items:center;gap:5px;white-space:nowrap}
#status input{accent-color:var(--navy)}
/* menus and modals */
.menu{position:fixed;z-index:30;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 12px 30px rgba(19,50,74,.22);padding:4px;min-width:230px;max-width:340px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;font-size:13.5px}
.menu button small{display:block;color:var(--muted);font-size:12px}
.menu button:hover:not(:disabled){background:#eef3f8}
.menu button:disabled{color:#9aa7b4;cursor:default}
.menu button.danger{color:var(--red)}
#modal{position:fixed;inset:0;background:rgba(15,30,45,.45);display:grid;place-items:center;z-index:40;padding:16px}
#modal[hidden]{display:none}
.mbox{background:#fff;border-radius:12px;max-width:440px;width:100%;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.3);max-height:calc(100vh - 32px);overflow:auto}
.mbox.wide{max-width:760px}
.mbox h3{margin:0 0 8px;font-size:20px;color:var(--navy)}
.mbox p{margin:6px 0}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.minput{width:100%;padding:8px 10px;border:1px solid #c4d0dc;border-radius:7px;font-size:15px}
.welcome{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:start}
.bun{width:150px;height:auto;border-radius:12px}
.bun.sm{width:80px}
.steps{padding-left:20px;margin:8px 0}.steps li{margin:4px 0}
.guide .ghead{display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:14px;align-items:center;margin-bottom:6px}
.guide .ghead .x{border:0;background:none;border-radius:6px;padding:4px;color:var(--muted)}
.guide section{border-top:1px solid var(--line);padding:8px 0}
.guide h4{margin:4px 0 6px;font-size:16px;color:var(--navy2)}
.guide p{font-size:14px;margin:5px 0;max-width:68ch}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.tcard{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;background:#fbfcfe}
.sketching #left .panel:not(#treeP):not(#varsP){opacity:.6}
@media (max-width:1100px){
  .brand .sub{display:none}
  #top .tb button:not(.guide) .lbl{display:none}
  #docName{width:170px}
}
@media (max-width:900px){
  #main{grid-template-columns:220px minmax(0,1fr)}
  .brand .sub,#top .tb button span.lbl{display:none}
  #docName{width:140px}
  #dlg{width:270px}
}
@media (max-width:600px){
  #main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 34%}
  #left{order:2;border-right:0;border-top:1px solid var(--line)}
  .welcome{grid-template-columns:minmax(0,1fr)}.bun{width:90px}
  #card{top:auto;bottom:10px;right:10px;left:10px;width:auto;max-height:45%}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><span class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 28 9.5v13L16 29 4 22.5v-13z" fill="#f28c28"/><path d="M16 3 28 9.5 16 16 4 9.5z" fill="#ffd2a3"/><path d="M16 16v13L4 22.5v-13z" fill="#c96a12"/><path d="M9 12.2l7 3.8 7-3.8" fill="none" stroke="#13324a" stroke-width="1.4"/></svg></span><b>Geo-CAD 3D</b><span class="sub">TS 82 Part Studio</span></div>
    <input id="docName" value="My part" aria-label="Part name" spellcheck="false">
    <div class="tb">
      <button data-act="new" aria-label="New part" title="New part"><span class="lbl">New</span></button>
      <button data-act="open" aria-label="Open a part file" title="Open a part file"><span class="lbl">Open</span></button>
      <button data-act="save" aria-label="Save the part file" title="Save the part file"><span class="lbl">Save</span></button>
      <button data-act="examples" aria-label="Examples" title="Examples"><span class="lbl">Examples</span></button>
      <button data-act="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><span class="lbl">Undo</span></button>
      <button data-act="redo" title="Redo (Ctrl+Y)" aria-label="Redo"><span class="lbl">Redo</span></button>
      <button data-act="export" aria-label="Export" title="Export"><span class="lbl">Export</span></button>
      <button data-act="guide" aria-label="Guide" title="Guide" class="guide"><span class="lbl">Guide</span></button>
    </div>
  </header>
  <nav id="toolbar" aria-label="Tools"></nav>
  <div id="optbar" hidden></div>
  <main id="main">
    <aside id="left">
      <section class="panel" id="varsP"><h2>Variables <button id="addVar" aria-label="Add a variable"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add</button></h2><div id="vars"></div></section>
      <section class="panel grow" id="treeP"><h2>Feature list</h2><div id="tree"></div></section>
      <section class="panel" id="partsP"><h2>Parts</h2><div id="parts"></div></section>
    </aside>
    <div id="view">
      <div id="boot">Loading Geo-CAD 3D…</div>
      <div id="dlg" hidden></div>
      <div id="card" hidden></div>
      <div id="toasts" aria-live="polite"></div>
    </div>
  </main>
  <footer id="status"><span id="hint"></span><span id="skStatus"></span><label><input type="checkbox" id="snapChk" checked> Snap to grid</label><span>Units: mm</span></footer>
</div>
<div id="tip" hidden></div>
<div id="modal" hidden></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script type="module">/*BUNDLE*/</script>
</body>
</html>
